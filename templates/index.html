<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI RAG Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>AI Chatbot with RAG</h1>

    <h2>Upload PDF</h2>

    <input type="file" id="pdfFile">

    <button onclick="uploadPDF()">
        Upload
    </button>

    <hr>

    <h2>Ask Question</h2>

    <input
        type="text"
        id="question"
        placeholder="Ask anything...">

    <button onclick="sendMessage()">
        Send
    </button>

    <hr>

    <h3>Answer</h3>

    <div id="answer"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
